{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-lg">
      <div class="card-header text-center">
        <h3 class="mb-0">
          <i class="fas fa-sign-in-alt me-2"></i>Welcome Back
        </h3>
      </div>
      <div class="card-body p-4">
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert alert-danger">
              <i class="fas fa-exclamation-triangle me-2"></i>{{ messages[0] }}
            </div>
          {% endif %}
        {% endwith %}

        <form method="post">
          <div class="mb-3">
            <label class="form-label">
              <i class="fas fa-user me-2"></i>Username
            </label>
            <input class="form-control" name="username" placeholder="Enter your username" required>
          </div>
          <div class="mb-3">
            <label class="form-label">
              <i class="fas fa-lock me-2"></i>Password
            </label>
            <input class="form-control" type="password" name="password" placeholder="Enter your password" required>
          </div>
          <button class="btn btn-primary w-100 btn-lg">
            <i class="fas fa-sign-in-alt me-2"></i>Login
          </button>
        </form>
        
        <div class="text-center mt-4">
          <p class="text-muted">Don't have an account? 
            <a href="/signup" class="text-decoration-none" style="color: #d4af37;">
              <i class="fas fa-user-plus me-1"></i>Sign up here
            </a>
          </p>
          <p>
            <a href="/" class="text-decoration-none" style="color: #d4af37;">
              <i class="fas fa-home me-1"></i>Back to Home
            </a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
