<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - BOOKMYSTAY-HOTEL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #0a0a0a;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
        }
        .navbar {
            background: rgba(10, 10, 10, 0.95) !important;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(212, 175, 55, 0.15);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }
        .navbar-brand {
            font-size: 1.5rem;
            letter-spacing: 1px;
            font-weight: 600;
            color: #d4af37 !important;
        }
        .card {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }
        .card-header {
            background: rgba(30, 30, 30, 0.9);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            color: #d4af37;
        }
        .btn-gold {
            background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
            border: none;
            color: #000;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            font-weight: 600;
        }
        .btn-gold:hover {
            background: linear-gradient(135deg, #f4d03f 0%, #d4af37 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
            color: #000;
        }
        .form-control {
            border-radius: 10px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 12px 16px;
            background: rgba(20, 20, 20, 0.6);
            color: #ffffff;
        }
        .form-control:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 0.2rem rgba(212, 175, 55, 0.25);
            background: rgba(20, 20, 20, 0.8);
            color: #ffffff;
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        .form-label {
            color: #d4af37;
            font-weight: 500;
        }
        .gold-text {
            color: #d4af37;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark px-4">
    <span class="navbar-brand fw-bold">
        <i class="fas fa-hotel me-2 gold-text"></i>BOOKMYSTAY-HOTEL
    </span>
    <a href="/" class="btn btn-outline-light">
        <i class="fas fa-home me-1"></i>Back to Home
    </a>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg">
                <div class="card-header text-center">
                    <h3 class="mb-0">
                        <i class="fas fa-user-plus me-2"></i>Create Your Account
                    </h3>
                </div>
                <div class="card-body p-4">
                    {% with messages = get_flashed_messages() %}
                        {% if messages %}
                            <div class="alert alert-danger">
                                <i class="fas fa-exclamation-triangle me-2"></i>{{ messages[0] }}
                            </div>
                        {% endif %}
                    {% endwith %}
                    
                    <form method="post">
                        <div class="mb-3">
                            <label class="form-label">
                                <i class="fas fa-user me-2"></i>Username
                            </label>
                            <input class="form-control" name="username" placeholder="Choose a username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">
                                <i class="fas fa-lock me-2"></i>Password
                            </label>
                            <input class="form-control" name="password" type="password" placeholder="Create a password" required>
                        </div>
                        <button class="btn btn-gold w-100 btn-lg">
                            <i class="fas fa-user-plus me-2"></i>Sign Up
                        </button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="text-muted">Already have an account? 
                            <a href="/login" class="text-decoration-none gold-text">
                                <i class="fas fa-sign-in-alt me-1"></i>Login here
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
